rules:
  - Do not merge bobPlanningIntegration wholesale into refreshed main.
  - Bob owns Bob-to-Linear mappings and Bob-to-T3 run/thread links.
  - Linear remains independently installable and is not a Bob dependency.
  - T3 core receives opaque external references and normalized work-item data only.
  - Mobile remains a native thin host and imports no Bob or Linear implementation modules.
nextSteps:
  - Port Bob credentials, planning, dispatch, and link persistence into the Bob plugin.
  - Port Linear auth, issue client, mapping, and issue provider into the Linear plugin.
  - Keep legacy routes behind a removable compatibility flag until plugin parity.
