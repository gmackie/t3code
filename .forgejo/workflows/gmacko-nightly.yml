# GMACKO nightly: sync the release lane onto upstream main and cut a release.
#
# Runs on ForgeGraph CI (Forgejo Actions at git.forgegraf.com) instead of
# GitHub Actions. Runner topology:
#   - ubuntu-24.04  → labnuc (docker runner): sync, preflight, Linux build,
#                      WSL node-pty prebuild, publish
#   - macos         → gmacko-mini (host runner): macOS arm64/x64 and the
#                      Windows cross-build (electron-builder NSIS on macOS)
#
# The release lane itself (branch custom-local) and the published releases stay
# on GitHub (gmackie/t3code) so existing installs keep auto-updating; only the
# compute moved. GitHub is reached with the GMACKO_GITHUB_TOKEN secret (a PAT
# with repo scope) — pushes and release uploads cost no Actions minutes.
#
# Secrets (Forgejo repo → Settings → Actions → Secrets):
#   GMACKO_GITHUB_TOKEN                 PAT: push custom-local + create releases
#   CSC_LINK / CSC_KEY_PASSWORD          Developer ID Application .p12 (base64) + password
#   APPLE_API_KEY / APPLE_API_KEY_ID /   App Store Connect API key (.p8 contents, id, issuer)
#     APPLE_API_ISSUER
#   MACOS_PROVISIONING_PROFILE           base64 .provisionprofile
#   CLOUDFLARE_API_TOKEN (optional)      relay tracing config; empty → skipped
#   RELAY_CLIENT_OTLP_TRACES_TOKEN (optional)
# Variables:
#   APPLE_TEAM_ID, CLERK_PASSKEY_RP_DOMAINS, and optionally CLOUDFLARE_ACCOUNT_ID,
#   RELAY_DOMAIN, RELAY_API_ZONE_NAME, T3CODE_CLERK_PUBLISHABLE_KEY,
#   T3CODE_CLERK_JWT_TEMPLATE, T3CODE_CLERK_CLI_OAUTH_CLIENT_ID
#
# Windows builds are produced unsigned here: Azure Trusted Signing needs
# Windows signtool and there is no Windows runner in the fleet.

name: GMACKO Nightly

on:
  schedule:
    # 09:00 UTC ≈ 02:00 America/Los_Angeles.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      force_release:
        description: "Cut a release even when upstream has no new commits and one already exists for the lane tip"
        required: false
        default: false
        type: boolean
      skip_sync:
        description: "Release the lane as-is without rebasing onto upstream"
        required: false
        default: false
        type: boolean

concurrency:
  group: gmacko-nightly
  cancel-in-progress: false

env:
  GITHUB_FORK: gmackie/t3code
  UPSTREAM_REPO: pingdotgg/t3code
  FORGEJO_REPO_URL: https://git.forgegraf.com/gmackie/t3code.git
  PNPM_VERSION: 11.10.0

jobs:
  sync:
    name: Sync lane onto upstream
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      ref: ${{ steps.lane.outputs.head_sha }}
      version: ${{ steps.release_meta.outputs.version }}
      tag: ${{ steps.release_meta.outputs.tag }}
      release_name: ${{ steps.release_meta.outputs.name }}
      previous_tag: ${{ steps.previous_tag.outputs.previous_tag }}
      should_release: ${{ steps.decide.outputs.should_release }}
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm --version

      - name: Clone release lane from GitHub
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GMACKO_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GITHUB_TOKEN:-}" ]]; then
            echo "GMACKO_GITHUB_TOKEN secret is required to read and publish the release lane." >&2
            exit 1
          fi
          git clone --branch custom-local --tags \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_FORK}.git" lane
          cd lane
          git config user.name "gmacko-nightly[bot]"
          git config user.email "gmacko-nightly@users.noreply.forgegraf.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream main --tags
          echo "Lane tip:     $(git rev-parse --short HEAD)"
          echo "Upstream tip: $(git rev-parse --short upstream/main)"

      - id: rebase_upstream
        name: Rebase custom-local onto upstream main
        shell: bash
        working-directory: lane
        run: |
          set -euo pipefail
          if [[ "${{ inputs.skip_sync }}" == "true" ]]; then
            echo "skip_sync requested; releasing the lane as-is."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Lane already contains upstream main."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          START_SHA="$(git rev-parse HEAD)"
          # Rebase reverses merge strategy labels: "theirs" is the GMACKO
          # commit being replayed, while "ours" is the new upstream base.
          git rebase --force-rebase -X theirs upstream/main
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "start_sha=$START_SHA" >> "$GITHUB_OUTPUT"

      - name: Refresh lockfile after rebase
        if: steps.rebase_upstream.outputs.has_changes == 'true'
        shell: bash
        working-directory: lane
        run: |
          set -euo pipefail
          LOCK_COMMIT_SUBJECT="chore: refresh lockfile after upstream rebase"
          pnpm install --lockfile-only --no-frozen-lockfile
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            if [[ "$(git log -1 --format=%s)" == "$LOCK_COMMIT_SUBJECT" ]]; then
              git commit --amend --no-edit
            else
              git commit -m "$LOCK_COMMIT_SUBJECT"
            fi
          fi

      - name: Push rebased lane to GitHub
        if: steps.rebase_upstream.outputs.has_changes == 'true'
        shell: bash
        working-directory: lane
        env:
          START_SHA: ${{ steps.rebase_upstream.outputs.start_sha }}
        run: |
          set -euo pipefail
          git push --force-with-lease="refs/heads/custom-local:${START_SHA}" origin "HEAD:custom-local"

      - id: lane
        name: Mirror lane to ForgeGraph
        shell: bash
        working-directory: lane
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Downstream jobs check this exact commit out from the Forgejo copy, and
          # the scheduled workflow definition itself lives on this branch here.
          mirror_url="${FORGEJO_REPO_URL/https:\/\//https://x-access-token:${FORGEJO_TOKEN}@}"
          git push --force "$mirror_url" "HEAD:refs/heads/custom-local"
          git push --force "$mirror_url" --tags
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: release_meta
        name: Resolve GMACKO release version
        shell: bash
        working-directory: lane
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --filter=@t3tools/scripts...
          node scripts/resolve-gmacko-release.ts \
            --stamp "$(date -u +%Y%m%d%H%M)" \
            --github-output

      - id: previous_tag
        name: Resolve previous release tag
        shell: bash
        working-directory: lane
        run: |
          set -euo pipefail
          node scripts/resolve-previous-release-tag.ts \
            --channel gmacko \
            --current-tag "${{ steps.release_meta.outputs.tag }}" \
            --github-output

      - id: decide
        name: Decide whether to release
        shell: bash
        working-directory: lane
        env:
          GH_TOKEN: ${{ secrets.GMACKO_GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.lane.outputs.head_sha }}
        run: |
          set -euo pipefail
          if [[ "${{ inputs.force_release }}" == "true" ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Nightly idempotence: skip when a GMACKO prerelease already targets
          # this exact lane tip (no upstream movement since the last cut).
          existing="$(
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${GITHUB_FORK}/releases?per_page=100" \
            | node -e '
                let raw = "";
                process.stdin.on("data", (c) => (raw += c)).on("end", () => {
                  const sha = process.env.HEAD_SHA;
                  const hit = JSON.parse(raw).find(
                    (r) => r.target_commitish === sha && !r.draft && r.prerelease && /^v\d+\.\d+\.\d+-gmacko\.\d+$/.test(r.tag_name),
                  );
                  process.stdout.write(hit ? hit.tag_name : "");
                });
              '
          )"
          if [[ -n "$existing" ]]; then
            echo "Release already published for ${HEAD_SHA}: ${existing}; nothing to do."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  preflight:
    name: Preflight (check, typecheck, test)
    needs: sync
    if: ${{ needs.sync.outputs.should_release == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout lane
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm and install
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm install --frozen-lockfile

      - name: Check
        run: pnpm vp check

      - name: Typecheck
        run: pnpm vp run typecheck

      - name: Test
        run: pnpm vp run test

  signing_secrets:
    name: Validate macOS signing secrets
    needs: sync
    if: ${{ needs.sync.outputs.should_release == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
    steps:
      - name: Validate signing configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID MACOS_PROVISIONING_PROFILE; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'macOS signing is required for GMACKO releases (existing installs only accept signed updates); missing: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          echo "macOS signing secrets are configured."

  relay_public_config:
    name: Resolve T3 Connect public config
    needs: [sync, preflight, signing_secrets]
    if: ${{ !failure() && !cancelled() && needs.sync.outputs.should_release == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      clerk_publishable_key: ${{ steps.public_config.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ steps.public_config.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ steps.public_config.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ steps.public_config.outputs.relay_url }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RELAY_DOMAIN: ${{ vars.RELAY_DOMAIN }}
      RELAY_API_ZONE_NAME: ${{ vars.RELAY_API_ZONE_NAME }}
      RELAY_CLIENT_OTLP_TRACES_URL: ${{ vars.RELAY_CLIENT_OTLP_TRACES_URL }}
      RELAY_CLIENT_OTLP_TRACES_DATASET: ${{ vars.RELAY_CLIENT_OTLP_TRACES_DATASET }}
      RELAY_CLIENT_OTLP_TRACES_TOKEN: ${{ secrets.RELAY_CLIENT_OTLP_TRACES_TOKEN }}
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.T3CODE_CLERK_PUBLISHABLE_KEY }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.T3CODE_CLERK_JWT_TEMPLATE }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID }}
    steps:
      - name: Checkout lane
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: relay_state
        name: Read production relay tracing config
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p relay-config
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" || -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "Cloudflare relay config is unavailable; writing an empty relay client tracing config."
            : > relay-config/relay-client-tracing.env
          else
            corepack enable
            corepack prepare "pnpm@${PNPM_VERSION}" --activate
            pnpm install --frozen-lockfile --filter=t3code-relay...
            pnpm vp run --filter t3code-relay deploy \
              --stage prod \
              --read-state \
              --github-output \
              --github-env-file "$PWD/relay-config/relay-client-tracing.env"
          fi

      - name: Upload relay client tracing config
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: relay-client-tracing-config
          path: relay-config/relay-client-tracing.env
          if-no-files-found: error
          retention-days: 1

      - id: public_config
        name: Resolve production relay public config
        shell: bash
        run: |
          set -euo pipefail
          relay_domain="${RELAY_DOMAIN:-}"
          if [[ -z "$relay_domain" && -n "${RELAY_API_ZONE_NAME:-}" ]]; then
            relay_domain="relay.$RELAY_API_ZONE_NAME"
          fi
          echo "clerk_publishable_key=${T3CODE_CLERK_PUBLISHABLE_KEY:-}" >> "$GITHUB_OUTPUT"
          echo "clerk_jwt_template=${T3CODE_CLERK_JWT_TEMPLATE:-}" >> "$GITHUB_OUTPUT"
          echo "clerk_cli_oauth_client_id=${T3CODE_CLERK_CLI_OAUTH_CLIENT_ID:-}" >> "$GITHUB_OUTPUT"
          if [[ -n "$relay_domain" ]]; then
            echo "relay_url=https://$relay_domain" >> "$GITHUB_OUTPUT"
          else
            echo "relay_url=" >> "$GITHUB_OUTPUT"
          fi

  # node-pty publishes no Linux prebuilt and the WSL backend runs under the
  # distro's own (Linux) Node. Build the Linux pty.node here and hand it to the
  # Windows packaging job so the artifact ships a ready WSL backend binary.
  build_wsl_node_pty:
    name: Build WSL node-pty (linux-x64)
    needs: [sync, preflight]
    if: ${{ !failure() && !cancelled() && needs.sync.outputs.should_release == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout lane
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm and install
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm install --frozen-lockfile

      - name: Build node-pty linux-x64 prebuild
        shell: bash
        run: |
          set -euo pipefail
          pty_pkg="$(node -e "console.log(require.resolve('node-pty/package.json', { paths: ['$PWD/apps/server'] }))")"
          pty_dir="$(dirname "$pty_pkg")"
          ( cd "$pty_dir" && npx --yes node-gyp rebuild )
          mkdir -p wsl-prebuild
          cp "$pty_dir/build/Release/pty.node" wsl-prebuild/pty.node
          file wsl-prebuild/pty.node

      - name: Upload node-pty linux-x64 prebuild
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: wsl-node-pty-x64
          path: wsl-prebuild/pty.node
          if-no-files-found: error

  build:
    name: Build ${{ matrix.label }}
    needs: [sync, preflight, relay_public_config, build_wsl_node_pty]
    if: ${{ !cancelled() && needs.sync.outputs.should_release == 'true' && needs.preflight.result == 'success' && needs.relay_public_config.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ needs.relay_public_config.outputs.clerk_publishable_key }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ needs.relay_public_config.outputs.clerk_jwt_template }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ needs.relay_public_config.outputs.clerk_cli_oauth_client_id }}
      T3CODE_RELAY_URL: ${{ needs.relay_public_config.outputs.relay_url }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos
            platform: mac
            target: dmg
            arch: arm64
            rust_target: aarch64-apple-darwin
          - label: macOS x64
            runner: macos
            platform: mac
            target: dmg
            arch: x64
            rust_target: x86_64-apple-darwin
          - label: Linux x64
            runner: ubuntu-24.04
            platform: linux
            target: AppImage
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
          - label: Windows x64
            runner: macos
            platform: win
            target: nsis
            arch: x64
            rust_target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout lane
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm and install
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm install --frozen-lockfile \
            --filter=@t3tools/desktop... \
            --filter=t3... \
            --filter=@t3tools/scripts...
          # The desktop build script spawns `vp` directly.
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Setup Rust
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1 && [[ ! -x "$HOME/.cargo/bin/rustup" ]]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain stable
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" target add "${{ matrix.rust_target }}" || true
          "$HOME/.cargo/bin/rustc" --version

      - name: Install Linux packaging dependencies
        if: matrix.platform == 'linux'
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
            sudo apt-get install -y imagemagick || {
              sudo apt-get update \
                -o Acquire::Retries=3 \
                -o Acquire::http::Timeout=30 \
                -o Acquire::https::Timeout=30
              sudo apt-get install -y imagemagick
            }
          fi
          # AppImage tooling needs FUSE-less extraction inside containers.
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      - name: Download relay client tracing config
        uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          name: relay-client-tracing-config
          path: relay-config

      - name: Load relay client tracing config
        shell: bash
        run: |
          set -euo pipefail
          config_path="relay-config/relay-client-tracing.env"
          tracing_token="$(sed -n 's/^T3CODE_RELAY_CLIENT_OTLP_TRACES_TOKEN=//p' "$config_path")"
          if [[ -n "$tracing_token" ]]; then
            echo "::add-mask::$tracing_token"
          fi
          cat "$config_path" >> "$GITHUB_ENV"

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.sync.outputs.version }}"

      - name: Download WSL node-pty prebuild
        if: matrix.platform == 'win'
        uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          name: wsl-node-pty-x64
          path: wsl-prebuild

      - name: Build desktop artifact
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
          T3CODE_CLERK_PASSKEY_RP_DOMAINS: ${{ vars.CLERK_PASSKEY_RP_DOMAINS }}
          T3CODE_DESKTOP_UPDATE_REPOSITORY: gmackie/t3code
          # electron-builder must never try to sign with whatever dev identity
          # happens to be in the host runner's keychain.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -euo pipefail
          args=(
            --platform "${{ matrix.platform }}"
            --target "${{ matrix.target }}"
            --arch "${{ matrix.arch }}"
            --build-version "${{ needs.sync.outputs.version }}"
            --verbose
          )

          has_all() {
            for value in "$@"; do
              if [[ -z "$value" ]]; then
                return 1
              fi
            done
            return 0
          }

          if [[ "${{ matrix.platform }}" == "mac" ]]; then
            if has_all "$CSC_LINK" "$CSC_KEY_PASSWORD" "$APPLE_API_KEY" "$APPLE_API_KEY_ID" "$APPLE_API_ISSUER" "$APPLE_TEAM_ID" "$MACOS_PROVISIONING_PROFILE"; then
              key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
              printf '%s' "$APPLE_API_KEY" > "$key_path"
              export APPLE_API_KEY="$key_path"

              profile_path="$RUNNER_TEMP/t3code.provisionprofile"
              printf '%s' "$MACOS_PROVISIONING_PROFILE" | base64 -D > "$profile_path"
              security cms -D -i "$profile_path" >/dev/null
              export T3CODE_APPLE_TEAM_ID="$APPLE_TEAM_ID"
              export T3CODE_MACOS_PROVISIONING_PROFILE="$profile_path"
              export CSC_IDENTITY_AUTO_DISCOVERY=true

              echo "macOS signing enabled."
              args+=(--signed)
            else
              echo "macOS signing is required for GMACKO releases; missing one or more Apple signing secrets." >&2
              exit 1
            fi
          elif [[ "${{ matrix.platform }}" == "win" ]]; then
            args+=(--wsl-prebuild "$PWD/wsl-prebuild/pty.node")
            echo "Windows signing disabled: Azure Trusted Signing requires a Windows runner."
          else
            echo "Signing disabled for ${{ matrix.platform }}."
          fi

          pnpm vp run dist:desktop:artifact "${args[@]}"

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob
          for pattern in "release/*.dmg" "release/*.zip" "release/*.AppImage" "release/*.exe" "release/*.blockmap" "release/*.yml"; do
            for file in $pattern; do
              cp "$file" release-publish/
            done
          done
          if [[ "${{ matrix.platform }}" == "mac" && "${{ matrix.arch }}" != "arm64" ]]; then
            for manifest in release-publish/*-mac.yml; do
              mv "$manifest" "${manifest%.yml}-${{ matrix.arch }}.yml"
            done
          fi
          ls -la release-publish

      - name: Upload build artifacts
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [sync, relay_public_config, build]
    if: ${{ !failure() && !cancelled() && needs.sync.outputs.should_release == 'true' && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GMACKO_GITHUB_TOKEN }}
    steps:
      - name: Checkout lane
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm and install scripts
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm install --frozen-lockfile --filter=@t3tools/scripts...

      - name: Install GitHub CLI
        shell: bash
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then
            gh --version
            exit 0
          fi
          gh_version="$(curl -fsSL https://api.github.com/repos/cli/cli/releases/latest | node -e 'let r="";process.stdin.on("data",c=>r+=c).on("end",()=>process.stdout.write(JSON.parse(r).tag_name.replace(/^v/,"")))')"
          curl -fsSL "https://github.com/cli/cli/releases/download/v${gh_version}/gh_${gh_version}_linux_amd64.tar.gz" -o /tmp/gh.tgz
          tar -xzf /tmp/gh.tgz -C /tmp
          sudo install "/tmp/gh_${gh_version}_linux_amd64/bin/gh" /usr/local/bin/gh
          gh --version

      - name: Download all desktop artifacts
        uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Merge macOS updater manifests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for x64_manifest in release-assets/*-mac-x64.yml; do
            arm64_manifest="${x64_manifest%-x64.yml}.yml"
            if [[ -f "$arm64_manifest" ]]; then
              node scripts/merge-update-manifests.ts --platform mac "$arm64_manifest" "$x64_manifest"
              rm -f "$x64_manifest"
            fi
          done
          ls -la release-assets

      - name: Publish release
        shell: bash
        env:
          TAG: ${{ needs.sync.outputs.tag }}
          RELEASE_NAME: ${{ needs.sync.outputs.release_name }}
          TARGET: ${{ needs.sync.outputs.ref }}
          PREVIOUS_TAG: ${{ needs.sync.outputs.previous_tag }}
        run: |
          set -euo pipefail
          notes_args=(--generate-notes)
          if [[ -n "${PREVIOUS_TAG:-}" ]]; then
            notes_args+=(--notes-start-tag "$PREVIOUS_TAG")
          fi
          assets=(release-assets/*.dmg release-assets/*.zip release-assets/*.AppImage release-assets/*.exe release-assets/*.blockmap release-assets/*.yml)
          for asset in "${assets[@]}"; do
            [[ -f "$asset" ]] || { echo "Missing expected asset: $asset" >&2; exit 1; }
          done
          gh release create "$TAG" "${assets[@]}" \
            --repo "$GITHUB_FORK" \
            --target "$TARGET" \
            --title "$RELEASE_NAME" \
            --prerelease \
            --latest=false \
            "${notes_args[@]}"
          echo "Published https://github.com/${GITHUB_FORK}/releases/tag/${TAG}"
