# Forgejo schedules run from the repository's default branch (custom-local).
# The implementation and artifacts stay on lockdown; only the timer lives here.
name: Dispatch lockdown daily build

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

concurrency:
  group: lockdown-daily-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: forgegraph-ci
    timeout-minutes: 5
    steps:
      - name: Start lockdown merge and build
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: token $FORGEJO_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"ref":"lockdown","inputs":{"merge_main":"true"}}' \
            'https://git.forgegraf.com/api/v1/repos/gmackie/t3code/actions/workflows/lockdown-build.yml/dispatches'
