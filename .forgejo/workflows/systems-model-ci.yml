name: Systems Model CI

on:
  pull_request:
    branches:
      - custom-local
    paths:
      - packages/systems-*/**
      - packages/contracts/src/systems.ts
      - packages/contracts/src/rpc.ts
      - packages/client-runtime/src/state/systems.ts
      - apps/server/src/systems/**
      - apps/server/src/systems-worker.ts
      - apps/server/src/persistence/Migrations.ts
      - apps/web/src/components/systems/**
      - vite.config.ts
      - .forgejo/workflows/systems-model-ci.yml
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  systems:
    runs-on: forgegraph-ci
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - name: Install pinned dependencies
        run: |
          corepack enable
          corepack prepare pnpm@12.14.0 --activate
          pnpm install --frozen-lockfile
      - name: Verify model schemas against the conformance fixtures
        run: |
          pnpm exec vp test run packages/systems-model
          pnpm --filter @t3tools/systems-model run typecheck
      - name: Compile and digest the conformance fixtures
        run: |
          pnpm exec vp test run packages/systems-compiler
          pnpm --filter @t3tools/systems-compiler run typecheck
      - name: Execute the statechart conformance fixtures
        run: |
          pnpm exec vp test run packages/systems-statechart
          pnpm --filter @t3tools/systems-statechart run typecheck
      - name: Simulate the conformance fixtures
        run: |
          pnpm exec vp test run packages/systems-runtime
          pnpm --filter @t3tools/systems-runtime run typecheck
      - name: Lint and format
        run: |
          pnpm exec vp lint packages/systems-model packages/systems-compiler packages/systems-statechart packages/systems-runtime
          pnpm exec vp fmt --check packages/systems-model packages/systems-compiler packages/systems-statechart packages/systems-runtime

  systems-integration:
    runs-on: forgegraph-ci
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - name: Install pinned dependencies
        run: |
          corepack enable
          corepack prepare pnpm@12.14.0 --activate
          pnpm install --frozen-lockfile
      - name: Run the Systems service and migration ledger tests
        run: |
          pnpm exec vp test run apps/server/src/systems apps/server/src/persistence/Migrations.test.ts apps/server/src/persistence/reconcileV2PreviewMigration.test.ts
          pnpm exec vp test run apps/web/src/components/systems apps/web/src/rightPanelStore.test.ts
      - name: Typecheck the server, contracts and clients
        run: |
          pnpm --filter t3 run typecheck
          pnpm --filter @t3tools/contracts run typecheck
          pnpm --filter @t3tools/client-runtime run typecheck
          (cd apps/web && pnpm exec tsc --noEmit)
          pnpm --filter @t3tools/mobile run typecheck
      - name: Lint and format
        run: |
          pnpm exec vp lint apps/server/src/systems apps/server/src/systems-worker.ts apps/web/src/components/systems packages/contracts/src/systems.ts packages/client-runtime/src/state/systems.ts
          pnpm exec vp fmt --check apps/server/src/systems apps/server/src/systems-worker.ts apps/web/src/components/systems packages/contracts/src/systems.ts packages/client-runtime/src/state/systems.ts
