name: Desktop Libs CI

on:
  pull_request:
    branches:
      - custom-local
    paths:
      - scripts/build-desktop-artifact.ts
      - scripts/build-desktop-artifact.test.ts
      - scripts/lib/desktopElectronBuilderConfig.ts
      - scripts/lib/desktopAppIdentity.ts
      - scripts/lib/desktopAppIdentity.test.ts
      - apps/desktop/scripts/electron-launcher.mjs
      - knip.jsonc
      - .forgejo/workflows/desktop-libs-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-libs:
    runs-on: forgegraph-ci
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - name: Install pinned dependencies
        run: |
          corepack enable
          corepack prepare pnpm@12.14.0 --activate
          pnpm install --frozen-lockfile
      - name: Verify the electron-builder config and dev app identity
        run: pnpm exec vp test run scripts/build-desktop-artifact.test.ts scripts/lib/desktopAppIdentity.test.ts
      - name: Verify the dev Electron launcher
        working-directory: apps/desktop
        run: pnpm exec vp test run scripts/electron-launcher.test.mjs
      # The export check behind it still reports older unused exports; keep files and dependencies clean.
      - name: No unused files or dependencies
        run: pnpm exec knip --include files,dependencies --no-config-hints
