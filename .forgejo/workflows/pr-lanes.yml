name: PR lanes

# Every pull request check in one job (T3CODE-100). The lanes used to be about
# twenty path-filtered workflows, each job with its own checkout and install:
# over two weeks those jobs spent 16.6 runner-hours on setup for 6.3 hours of
# checks, and a pull request commit waited a median 14 minutes for shared
# runner slots. scripts/pr-lanes.ts lists the lanes with their paths and
# commands; scripts/run-pr-lanes.ts picks the ones a pull request touches and
# runs them from this one install.
on:
  pull_request:
    branches:
      - custom-local
      # Pull requests stacked on another T3CODE branch; lanes opt in per branch.
      - "T3CODE-*"
      - "T3CODE-41-**"
  workflow_dispatch:
    inputs:
      lanes:
        description: Comma-separated lane ids from scripts/pr-lanes.ts, or "all"
        required: false
        default: all

permissions:
  contents: read
  pull-requests: read

# A newer push to the same pull request supersedes the run in progress.
concurrency:
  group: pr-lanes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lanes:
    # The small runners can fill their Docker disk during the workspace install.
    runs-on: [forgegraph-ci, heavy]
    container:
      # The 1.64.1 image ships a newer Chromium than playwright-core 1.64.1 downloads.
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - name: Install pinned dependencies
        run: |
          npm install --global --no-audit --no-fund "$(node -p 'require("./package.json").packageManager')"
          pnpm install --frozen-lockfile
      - name: Verify preinstalled Chromium
        working-directory: apps/server
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { chromium } from "playwright-core";
          import registry from "./node_modules/playwright-core/browsers.json" with { type: "json" };
          const shell = registry.browsers.find(({ name }) => name === "chromium-headless-shell");
          const browser = await chromium.launch();
          const actual = browser.version();
          await browser.close();
          assert.equal(actual, shell.browserVersion, "Update the PR lane image to match Playwright");
          console.log("Preinstalled Chromium", actual);
          NODE
      - name: Run the lanes this pull request touches
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_LANES: ${{ inputs.lanes }}
        run: node scripts/run-pr-lanes.ts
