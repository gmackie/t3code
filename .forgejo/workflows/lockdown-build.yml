name: Lockdown daily merge and build

on:
  push:
    branches:
      - lockdown
  workflow_dispatch:
    inputs:
      merge_main:
        description: Merge repository main before building
        type: boolean
        default: true

concurrency:
  group: lockdown-daily
  cancel-in-progress: false

env:
  PNPM_VERSION: 11.10.0

jobs:
  candidate:
    runs-on: forgegraph-ci
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      start_sha: ${{ steps.candidate.outputs.start_sha }}
      branch: ${{ steps.candidate.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lockdown
          fetch-depth: 0
          path: lockdown-${{ github.run_id }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - id: candidate
        name: Merge main into an unpublished candidate
        shell: bash
        working-directory: lockdown-${{ github.run_id }}
        env:
          MERGE_MAIN: ${{ inputs.merge_main }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name 'lockdown-daily[bot]'
          git config user.email 'lockdown-daily@users.noreply.forgegraf.com'
          git fetch origin main lockdown
          start_sha="$(git rev-parse origin/lockdown)"
          if [[ "$EVENT_NAME" == push && "$start_sha" != "$EVENT_SHA" ]]; then
            echo 'Lockdown advanced after this push; refusing to build a stale revision.' >&2
            exit 1
          fi
          git checkout -B lockdown-candidate "$start_sha"
          if [[ "$EVENT_NAME" != push && "$MERGE_MAIN" != false ]]; then
            # Conflicts fail the run: never resolve by restoring prohibited upstream features.
            git merge --no-edit -m 'Merge main into lockdown [skip ci]' origin/main
            corepack enable
            corepack prepare "pnpm@${PNPM_VERSION}" --activate
            pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
            git add pnpm-lock.yaml
            if ! git diff --cached --quiet; then
              git commit -m 'chore(lockdown): refresh merged lockfile [skip ci]'
            fi
          fi
          candidate_branch="lockdown-build-${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/$candidate_branch"
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "start_sha=$start_sha"
            echo "branch=$candidate_branch"
          } >> "$GITHUB_OUTPUT"

  verify:
    needs: candidate
    runs-on: forgegraph-ci
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          path: lockdown-${{ github.run_id }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - name: Install and check restrictions
        shell: bash
        working-directory: lockdown-${{ github.run_id }}
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm install --frozen-lockfile
          bash scripts/verify-lockdown-ci.sh

  linux:
    needs: [candidate, verify]
    runs-on: forgegraph-ci
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          path: lockdown-${{ github.run_id }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends libsecret-1-dev pkg-config imagemagick build-essential curl
          if [[ ! -x "$HOME/.cargo/bin/rustup" ]]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" target add x86_64-unknown-linux-gnu
      - name: Build Linux x64
        shell: bash
        working-directory: lockdown-${{ github.run_id }}
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm install --frozen-lockfile
          bash scripts/build-lockdown-ci.sh linux x64 "$PWD/release-lockdown"
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v5
        with:
          name: lockdown-linux-x64-${{ needs.candidate.outputs.sha }}
          path: lockdown-${{ github.run_id }}/release-lockdown/*
          if-no-files-found: error
          retention-days: 14

  macos:
    needs: [candidate, verify]
    runs-on: macos
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          path: lockdown-${{ github.run_id }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - name: Install macOS build dependencies
        shell: bash
        working-directory: lockdown-${{ github.run_id }}
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm install --frozen-lockfile
          if [[ ! -x "$HOME/.cargo/bin/rustup" ]]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build macOS arm64 and x64 sequentially
        shell: bash
        working-directory: lockdown-${{ github.run_id }}
        run: |
          set -euo pipefail
          bash scripts/build-lockdown-ci.sh mac arm64 "$PWD/release-arm64"
          bash scripts/build-lockdown-ci.sh mac x64 "$PWD/release-x64"
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v5
        with:
          name: lockdown-macos-${{ needs.candidate.outputs.sha }}
          path: |
            lockdown-${{ github.run_id }}/release-arm64/*
            lockdown-${{ github.run_id }}/release-x64/*
          if-no-files-found: error
          retention-days: 14

  promote:
    needs: [candidate, verify, linux, macos]
    runs-on: forgegraph-ci
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          fetch-depth: 0
          path: lockdown-${{ github.run_id }}
      - name: Promote only the verified candidate
        shell: bash
        working-directory: lockdown-${{ github.run_id }}
        env:
          START_SHA: ${{ needs.candidate.outputs.start_sha }}
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
          CANDIDATE_BRANCH: ${{ needs.candidate.outputs.branch }}
        run: |
          set -euo pipefail
          git fetch origin lockdown
          if [[ "$(git rev-parse origin/lockdown)" != "$START_SHA" ]]; then
            echo 'Lockdown changed while builds ran; refusing to overwrite it.' >&2
            exit 1
          fi
          if [[ "$CANDIDATE_SHA" != "$START_SHA" ]]; then
            git merge-base --is-ancestor "$START_SHA" "$CANDIDATE_SHA"
            git push --force-with-lease="refs/heads/lockdown:$START_SHA" origin "$CANDIDATE_SHA:refs/heads/lockdown"
          fi
          git push origin --delete "$CANDIDATE_BRANCH"
          echo "Verified lockdown revision: $CANDIDATE_SHA"
