name: Mini CI storage guards

on:
  pull_request:
    branches:
      - custom-local
    paths:
      - scripts/mini-ci-storage*
      - .forgejo/workflows/mini-ci-storage.yml
      - .forgejo/workflows/gmacko-nightly.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage-guards:
    runs-on: forgegraph-ci
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - name: Prepare the release package manager
        run: |
          corepack enable
          corepack prepare pnpm@11.10.0 --activate
      - name: Verify storage rejection and preservation
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/mini-ci-storage.test.py

  live-placement:
    if: github.event_name == 'workflow_dispatch'
    runs-on: gmacko-mini
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate SSD and export job paths
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          T3CODE_MINI_CI_ROOT: ${{ vars.MINI_CI_STORAGE_ROOT || '/Volumes/FleetNativeFast-20261009/t3-ci' }}
        run: python3 scripts/mini-ci-storage.py
      - name: Verify actual workspace, temporary files, and package caches
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          COREPACK_ENABLE_NETWORK: "0"
          npm_config_manage_package_manager_versions: "false"
        run: python3 scripts/mini-ci-storage-probe.py
