name: Routing CI

on:
  pull_request:
    branches:
      - custom-local
    paths:
      - apps/server/src/routing/**
      - apps/web/src/state/routing.ts
      - apps/web/src/components/chat/RoutingBadge*
      - apps/web/src/components/chat/MessagesTimeline*
      - packages/contracts/src/routing.ts
      - packages/provider-opencode/src/server/**
      - .forgejo/workflows/routing-ci.yml
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-routing:
    runs-on: forgegraph-ci
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - name: Install pinned dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.10.0 --activate
          pnpm install --frozen-lockfile
      - name: Verify the Pistache routing source
        working-directory: apps/server
        run: |
          pnpm exec vp test run src/routing
          pnpm exec tsc --noEmit
      # Lint from the root: oxlint resolves the repo's local plugin relative to it.
      - name: Lint the Pistache routing source
        run: |
          pnpm exec vp lint apps/server/src/routing
          pnpm exec vp fmt --check apps/server/src/routing

  web-routing:
    runs-on: forgegraph-ci
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - name: Install pinned dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.10.0 --activate
          pnpm install --frozen-lockfile
      - name: Verify routing badges and the timeline
        working-directory: apps/web
        run: |
          pnpm exec vp test run src/components/chat/RoutingBadge.logic.test.ts src/components/chat/MessagesTimeline --project unit
          pnpm exec tsc --noEmit
      - name: Lint routing badges and the timeline
        run: |
          pnpm exec vp lint apps/web/src/components/chat/RoutingBadge.tsx apps/web/src/components/chat/RoutingBadge.logic.ts apps/web/src/components/chat/MessagesTimeline.logic.ts
          pnpm exec vp fmt --check apps/web/src/state/routing.ts apps/web/src/components/chat/RoutingBadge.tsx apps/web/src/components/chat/RoutingBadge.logic.ts apps/web/src/components/chat/RoutingBadge.logic.test.ts apps/web/src/components/chat/MessagesTimeline.tsx apps/web/src/components/chat/MessagesTimeline.logic.ts

  # Pistache threads run through OpenCode; its adapter decides how their turns end.
  opencode-adapter:
    runs-on: forgegraph-ci
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - name: Install pinned dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.10.0 --activate
          pnpm install --frozen-lockfile
      # The server-ledger tests check that a killed process group is gone. The CI
      # container's PID 1 does not reap orphans, so the group lingers there as zombies;
      # run those tests on a developer machine (they pass on macOS).
      - name: Verify the OpenCode provider
        working-directory: packages/provider-opencode
        run: |
          pnpm exec vp test run --config ../../vite.config.ts --dir . --exclude "**/OpenCodeServerLedger.test.ts"
          pnpm typecheck
      - name: Lint the OpenCode provider
        run: |
          pnpm exec vp lint packages/provider-opencode/src/server
          pnpm exec vp fmt --check packages/provider-opencode/src/server
