name: Bob coordination

on:
  pull_request:
  push:
    branches:
      - main
      - T3CODE-6-coordination
  workflow_dispatch:

concurrency:
  group: bob-coordination-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coordination:
    runs-on: forgegraph-ci
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
      - name: Install pinned dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.10.0 --activate
          pnpm install --frozen-lockfile
      - name: Verify ForgeC artifacts
        run: node scripts/sync-bob-contract.mjs --check
      - name: Check affected server and clients
        run: |
          pnpm exec tsc --noEmit -p apps/server/tsconfig.json
          pnpm exec tsc --noEmit -p apps/web/tsconfig.json
          pnpm exec tsc --noEmit -p apps/mobile/tsconfig.json
      - name: Verify admission, receipts and project-scoped management
        run: |
          pnpm exec vp test run \
            packages/contracts/src/bobCoordination.test.ts \
            apps/server/src/coordination/ExecutionAdmission.test.ts \
            apps/server/src/coordination/ExecutionReceipts.test.ts \
            apps/server/src/coordination/http.test.ts \
            apps/server/src/orchestration-v2/ThreadLaunchService.test.ts \
            apps/server/src/mcp/toolkits/core.test.ts \
            apps/server/src/mcp/toolkits/coordination/handlers.test.ts \
            apps/web/src/rightPanelStore.test.ts
