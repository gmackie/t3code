name: Reverse workbench integration
on:
  pull_request:
    paths:
      - 'apps/server/src/reverse/**'
      - 'apps/web/src/components/reverse/**'
      - 'packages/contracts/src/reverse*'
      - 'scripts/reverse-*'
      - '.github/workflows/reverse-workbench.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Default credential handling: with persist-credentials disabled, checkout
      # runs `git submodule foreach` mid-step and dies on the vendored .repos gitlinks.
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node --test scripts/reverse-runtime-smoke.ts
  ghidra-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Default credential handling: with persist-credentials disabled, checkout
      # runs `git submodule foreach` mid-step and dies on the vendored .repos gitlinks.
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Download and verify pinned Ghidra 12.1.4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,urllib.request,zipfile
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          request=urllib.request.Request('https://api.github.com/repos/NationalSecurityAgency/ghidra/releases/tags/Ghidra_12.1.4_build',headers=headers)
          release=json.load(urllib.request.urlopen(request))
          assets=[a for a in release['assets'] if a['name'].endswith('.zip')]
          assert len(assets)==1, 'Expected exactly one release zip'
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'ghidra.zip'
          urllib.request.urlretrieve(assets[0]['browser_download_url'],path)
          assert hashlib.file_digest(path.open('rb'),'sha256').hexdigest()=='ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db'
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'ghidra-release'
          with zipfile.ZipFile(path) as archive: archive.extractall(root)
          install=next(root.iterdir())
          for name in ['support/analyzeHeadless','support/launch.sh']: (install/name).chmod(0o755)
          for binary in (install/'Ghidra').glob('**/os/linux_x86_64/*'):
              if binary.is_file(): binary.chmod(0o755)
          with open(os.environ['GITHUB_ENV'],'a') as env: env.write('GHIDRA_INSTALL_DIR='+str(install)+'\n')
          PY
      - run: node scripts/reverse-ghidra-smoke.ts
