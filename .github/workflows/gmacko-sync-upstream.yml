name: Gmacko Sync Upstream

on:
  schedule:
    - cron: "30 */3 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: gmacko-sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Rebase upstream and release
    # Scheduled workflows only run from the repository default branch. Keep this
    # workflow on main-local, but make the mutable release branch custom-local.
    if: github.repository == 'gmackie/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout custom-local
        uses: actions/checkout@v6
        with:
          ref: custom-local
          fetch-depth: 0
          token: ${{ secrets.GMACKO_SYNC_TOKEN || github.token }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - id: rebase_upstream
        name: Rebase custom-local onto upstream
        run: |
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          START_SHA="$(git rev-parse HEAD)"
          # Rebase reverses merge strategy labels: "theirs" is the GMACKO
          # commit being replayed, while "ours" is the new upstream base.
          git rebase --force-rebase -X theirs upstream/main
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "start_sha=$START_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Vite+
        if: steps.rebase_upstream.outputs.has_changes == 'true'
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - id: refresh_lockfile
        name: Refresh lockfile after rebase
        if: steps.rebase_upstream.outputs.has_changes == 'true'
        run: |
          LOCK_COMMIT_SUBJECT="chore: refresh lockfile after upstream rebase"
          vp install --lockfile-only --no-frozen-lockfile
          git add pnpm-lock.yaml

          if ! git diff --cached --quiet; then
            if [[ "$(git log -1 --format=%s)" == "$LOCK_COMMIT_SUBJECT" ]]; then
              git commit --amend --no-edit
            else
              git commit -m "$LOCK_COMMIT_SUBJECT"
            fi
          fi

          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push rebased custom-local
        if: steps.rebase_upstream.outputs.has_changes == 'true'
        env:
          START_SHA: ${{ steps.rebase_upstream.outputs.start_sha }}
        run: |
          git push --force-with-lease="refs/heads/custom-local:$START_SHA" origin "HEAD:custom-local"

      - name: Publish synchronized GMACKO release
        env:
          GH_TOKEN: ${{ secrets.GMACKO_SYNC_TOKEN || github.token }}
          EXPECTED_SHA: ${{ steps.refresh_lockfile.outputs.head_sha || steps.rebase_upstream.outputs.head_sha }}
        run: |
          ref_visible=false
          for attempt in 1 2 3 4 5; do
            if visible_sha="$(
              gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/custom-local" \
                --jq '.object.sha' 2>/dev/null
            )" && [[ "$visible_sha" == "$EXPECTED_SHA" ]]; then
              ref_visible=true
              break
            fi
            sleep $((attempt * 2))
          done
          if [[ "$ref_visible" != "true" ]]; then
            echo "Updated custom-local is not visible through the GitHub API." >&2
            exit 1
          fi

          existing_release_tag="$(
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
              jq -r --arg expected_sha "$EXPECTED_SHA" '
                [
                  .[]
                  | select(.target_commitish == $expected_sha)
                  | select(.draft == false and .prerelease == true)
                  | select(.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-gmacko\\.[0-9]+$"))
                ][0].tag_name // empty
              '
          )"
          if [[ -n "$existing_release_tag" ]]; then
            echo "Release already published for $EXPECTED_SHA: $existing_release_tag"
            exit 0
          fi

          known_release_run_ids="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow release.yml \
              --branch custom-local \
              --event workflow_dispatch \
              --commit "$EXPECTED_SHA" \
              --limit 100 \
              --json databaseId \
              --jq '.[].databaseId'
          )"

          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref custom-local \
            -f channel=gmacko

          release_run_id=""
          for attempt in $(seq 1 12); do
            release_run_id="$(
              gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow release.yml \
                --branch custom-local \
                --event workflow_dispatch \
                --commit "$EXPECTED_SHA" \
                --limit 20 \
                --json databaseId \
                --jq '[.[].databaseId | tostring]'
            )"
            release_run_id="$(
              jq -nr \
                --arg known "$known_release_run_ids" \
                --argjson candidates "$release_run_id" '
                  ($known | split("\n")) as $known_ids
                  | [$candidates[] | select(. as $id | $known_ids | index($id) | not)][0] // empty
                '
            )"
            if [[ -n "$release_run_id" ]]; then
              break
            fi
            sleep 5
          done

          if [[ -z "$release_run_id" ]]; then
            echo "Dispatched release run was not found for $EXPECTED_SHA." >&2
            exit 1
          fi

          for attempt in $(seq 1 160); do
            release_state="$(
              gh run view "$release_run_id" \
                --repo "$GITHUB_REPOSITORY" \
                --json status,conclusion \
                --jq '[.status, (.conclusion // "")] | @tsv'
            )"
            IFS=$'\t' read -r release_status release_conclusion <<< "$release_state"

            if [[ "$release_status" == "completed" ]]; then
              if [[ "$release_conclusion" == "success" ]]; then
                exit 0
              fi
              echo "Release run $release_run_id completed with $release_conclusion." >&2
              exit 1
            fi
            sleep 15
          done

          echo "Timed out waiting for release run $release_run_id." >&2
          exit 1
