name: Gmacko Sync Upstream

on:
  schedule:
    - cron: "30 10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gmacko-sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Prepare upstream sync PR
    # Scheduled workflows only run from the repository default branch. Keep this
    # workflow on main-local, but make the mutable release branch custom-local.
    if: github.repository == 'gmackie/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout custom-local
        uses: actions/checkout@v6
        with:
          ref: custom-local
          fetch-depth: 0
          token: ${{ secrets.GMACKO_SYNC_TOKEN || github.token }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - id: sync_branch
        name: Prepare sync branch
        env:
          SYNC_BRANCH: automation/gmacko-upstream-sync
        run: |
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git ls-remote --exit-code --heads origin "$SYNC_BRANCH" >/dev/null; then
            git fetch origin "$SYNC_BRANCH:refs/remotes/origin/$SYNC_BRANCH"
          fi

          git switch -C "$SYNC_BRANCH" upstream/main
          git push --force-with-lease origin "HEAD:$SYNC_BRANCH"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Open or update sync PR
        if: steps.sync_branch.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GMACKO_SYNC_TOKEN || github.token }}
          SYNC_BRANCH: automation/gmacko-upstream-sync
        run: |
          ref_visible=false
          for attempt in 1 2 3 4 5; do
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$SYNC_BRANCH" >/dev/null 2>&1; then
              ref_visible=true
              break
            fi
            sleep $((attempt * 2))
          done
          if [[ "$ref_visible" != "true" ]]; then
            echo "Sync branch was pushed but is not visible through the GitHub API." >&2
            exit 1
          fi

          existing_pr="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --base custom-local \
              --head "$GITHUB_REPOSITORY_OWNER:$SYNC_BRANCH" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [[ -n "$existing_pr" ]]; then
            gh pr edit "$existing_pr" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Sync upstream main into custom-local" \
              --body "Automated upstream sync for GMACKO. GitHub reports any conflicts for manual resolution. Merge only after required checks pass."
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base custom-local \
              --head "$GITHUB_REPOSITORY_OWNER:$SYNC_BRANCH" \
              --title "Sync upstream main into custom-local" \
              --body "Automated upstream sync for GMACKO. GitHub reports any conflicts for manual resolution. Merge only after required checks pass."
          fi
